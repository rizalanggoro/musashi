openapi: 3.1.0
info:
  title: MUSASHI API
  version: 0.1.0
  description: |
    Project monitoring & cost estimate API.
    Kontrak ini adalah sumber kebenaran untuk client TypeScript (heyapi) dan backend Go.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Service health
      tags: [system]
      responses:
        "200":
          description: Service and database are reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Health:
      type: object
      required: [status, database, time]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [up, down]
        time:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
